[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mail-agent"
version = "0.1.0"
description = "Почтовый AI-агент"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1,<2",
    "openai>=1,<3",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[project.scripts]
mail-agent = "mail_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["ANN", "B", "D", "E", "F", "I", "UP"]
ignore = ["D203", "D213"]